# Perfil del stack Express. Lo lee scripts/instalar.sh (formato sh: VARIABLE="valor").
# Los comandos son los habituales del stack: se confirman contra el package.json de cada template.
STACK_NOMBRE="Node.js + Express"
CAPAS="BFF, API o MS"
SKILL="node-express"
CMD_INSTALAR="npm ci"
CMD_BUILD="npm run build (si el template compila TypeScript)"
CMD_LINT="npm run lint"
CMD_TEST="npm test"
CMD_TEST_FOCO="npm test -- <archivo o patrón>"
CMD_TEST_INTEGRACION="npm run test:e2e (si el template lo define)"
CMD_DEPS="npm audit --omit=dev"
ARCHIVOS_TEST="*.spec.(js|ts), *.test.(js|ts), carpetas test/ y tests/"
MCP="ninguno"
# Rendimiento: el área de performance ejecuta el plan JMeter de BFF, API y MS antes del pase.
JMETER="sí: un plan por spec que agrega o cambia endpoints, en perf/NNN-nombre/ (skill sdd-jmeter)"
CMD_JMETER="jmeter -n -t perf/<NNN-nombre>/<NNN-nombre>.jmx -Jhost=localhost -Jpuerto=<puerto> -Jusuarios=1 -Jduracion=10 -l perf/resultados/<NNN>.jtl"
SKILL_RENDIMIENTO="sdd-jmeter"
