# Perfil del stack Angular. Lo lee scripts/instalar.sh (formato sh: VARIABLE="valor").
# Los comandos son los del Angular CLI: se confirman contra el package.json de cada template.
STACK_NOMBRE="Angular"
CAPAS="front web"
SKILL="angular-developer"
CMD_INSTALAR="npm ci"
CMD_BUILD="npm run build (ng build)"
CMD_LINT="npm run lint (ng lint)"
CMD_TEST="npm test (ng test)"
CMD_TEST_FOCO="npm test -- --include <archivo>"
CMD_TEST_INTEGRACION="no aplica: los E2E van en el repo de la célula (funcionalidades/<funcionalidad>/e2e)"
CMD_DEPS="npm audit --omit=dev"
ARCHIVOS_TEST="*.spec.ts"
MCP="Angular CLI MCP (npx -y @angular/cli mcp), pendiente de la allowlist de MCP de la organización"
# Rendimiento: no aplica a front; el plan JMeter va en BFF, API y MS.
JMETER="no aplica (front)"
CMD_JMETER="no aplica"
SKILL_RENDIMIENTO=""
