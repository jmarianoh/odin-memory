# Perfil del stack Flutter. Lo lee scripts/instalar.sh (formato sh: VARIABLE="valor").
# Los comandos son los del SDK de Flutter: se confirman contra el pipeline de cada template.
STACK_NOMBRE="Flutter"
CAPAS="front app (iOS y Android)"
SKILL="flutter"
CMD_INSTALAR="flutter pub get"
CMD_BUILD="flutter build apk --debug (o el flavor que use el template)"
CMD_LINT="dart format --output=none --set-exit-if-changed . && flutter analyze"
CMD_TEST="flutter test"
CMD_TEST_FOCO="flutter test <archivo> --plain-name '<nombre>'"
CMD_TEST_INTEGRACION="flutter test integration_test"
CMD_DEPS="flutter pub outdated (y osv-scanner --lockfile=pubspec.lock si está disponible)"
ARCHIVOS_TEST="*_test.dart en test/ e integration_test/"
MCP="Dart y Flutter MCP (dart mcp-server), pendiente de la allowlist de MCP de la organización"
# Rendimiento: no aplica a front; el plan JMeter va en BFF, API y MS.
JMETER="no aplica (front)"
CMD_JMETER="no aplica"
SKILL_RENDIMIENTO=""
