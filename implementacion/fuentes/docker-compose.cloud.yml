# Pila local del servidor de la nube: Postgres y `odin cloud serve`.
#   docker compose -f docker-compose.cloud.yml up --build
# Por defecto corre sin autenticación (solo desarrollo, solo en 127.0.0.1). Para autenticar:
#   1. Quitar ODIN_CLOUD_INSECURE_NO_AUTH y definir ODIN_CLOUD_TOKEN (y, si se usan tokens gestionados,
#      ODIN_CLOUD_TOKEN_PEPPER, una pimienta de al menos 32 bytes distinta de ODIN_JWT_SECRET).
#   2. Cambiar ODIN_JWT_SECRET por un valor propio.
#   3. Crear el primer administrador:
#      docker compose -f docker-compose.cloud.yml run --rm cloud cloud bootstrap admin --username admin --issue-token
services:
  postgres:
    image: postgres:16-alpine
    container_name: odin-cloud-postgres
    environment:
      POSTGRES_USER: odin
      POSTGRES_PASSWORD: odin_dev
      POSTGRES_DB: odin_cloud
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odin -d odin_cloud"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - odin-cloud-pg:/var/lib/postgresql/data

  cloud:
    build:
      context: .
      dockerfile: docker/cloud/Dockerfile
    container_name: odin-cloud
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ODIN_DATABASE_URL: postgres://odin:odin_dev@postgres:5432/odin_cloud?sslmode=disable
      ODIN_JWT_SECRET: odin-dev-jwt-secret-for-local-smoke-1234
      ODIN_CLOUD_INSECURE_NO_AUTH: "1"
      ODIN_CLOUD_ALLOWED_PROJECTS: smoke-project
      ODIN_CLOUD_HOST: 0.0.0.0
      ODIN_PORT: "18080"
      # ODIN_CLOUD_TOKEN: replace-with-a-long-random-token
      # ODIN_CLOUD_TOKEN_PEPPER: replace-with-dedicated-managed-token-pepper
    ports:
      - "127.0.0.1:18080:18080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18080/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6
    command: ["cloud", "serve"]

volumes:
  odin-cloud-pg:
